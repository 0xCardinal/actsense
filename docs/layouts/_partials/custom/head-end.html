<!-- Remove hextra-max-footer-width div -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Find all elements with hextra-max-footer-width class
  const elements = document.querySelectorAll('.hextra-max-footer-width');
  
  // Remove only the last instance
  if (elements.length > 0) {
    const lastElement = elements[elements.length - 1];
    lastElement.remove();
  }

  // Copy docker command on homepage hero. Feedback is an icon swap in a
  // fixed-size slot (plus a screen-reader status), so the card never resizes.
  const commandCard = document.getElementById('hero-command-card');
  const statusEl = document.getElementById('hero-command-status');
  const commandEl = document.getElementById('hero-docker-command');

  if (commandCard && commandEl) {
    let resetTimer;
    const flash = function(state, message) {
      commandCard.classList.remove('copied', 'failed');
      commandCard.classList.add(state);
      if (statusEl) statusEl.textContent = message;
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function() {
        commandCard.classList.remove(state);
        if (statusEl) statusEl.textContent = '';
      }, 1400);
    };
    const copyCommand = async function() {
      try {
        await navigator.clipboard.writeText(commandEl.textContent.trim());
        flash('copied', 'Copied to clipboard');
      } catch (err) {
        flash('failed', 'Copy failed');
      }
    };

    commandCard.addEventListener('click', copyCommand);
    commandCard.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        copyCommand();
      }
    });
  }
});
</script>
